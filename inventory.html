<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a33">
<title>NODO | المخزون</title>
<style>
:root{--navy:#071a33;--navy2:#102b4d;--gold:#d8b45a;--cream:#f8f4e9;--warn:#e8a33d;--bad:#e5645a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--cream);
background:radial-gradient(ellipse at top,#17395d 0%,var(--navy) 56%,#040d1a 100%);
display:flex;justify-content:center;padding:28px 16px}
.wrap{width:min(100%,520px)}
.frame{position:relative;border-radius:26px;padding:34px 22px 28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.rope{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
header{text-align:center}
.logo{display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(0,0,0,.45)}
h1{margin:0;font-size:26px;letter-spacing:6px;color:var(--gold)}
.sub{font-size:13px;color:#e8d6a7;margin:4px 0 18px}
.rule{height:1px;background:var(--gold);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.stat{background:var(--navy2);border:1px solid var(--gold);border-radius:12px;padding:9px 2px;text-align:center}
.stat b{display:block;font-size:16px;color:var(--gold)}
.stat span{font-size:10px;color:#e8d6a7}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.full{grid-column:1/-1}
label{font-size:11px;color:#e8d6a7;display:block;margin-bottom:3px}
input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--gold);border-radius:12px;background:var(--navy2);color:var(--cream);font:inherit;font-size:15px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{min-height:46px;border:1px solid var(--gold);border-radius:12px;background:var(--gold);color:var(--navy);font:inherit;font-weight:bold;font-size:15px;cursor:pointer}
.btn.ghost{background:var(--navy2);color:var(--cream)}
.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tools .btn{font-size:13px}
.search{margin-bottom:14px}
.list{display:grid;gap:10px}
.item{background:var(--navy2);border:1px solid rgba(216,180,90,.55);border-radius:14px;padding:12px}
.item.low{border-color:var(--warn)}.item.out{border-color:var(--bad)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.name{font-weight:bold;font-size:16px;word-break:break-word}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin-inline-start:8px;color:var(--navy);background:var(--warn)}
.badge.out{background:var(--bad);color:#fff}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--gold);color:#e8d6a7}
.icons{display:flex;gap:6px;flex-shrink:0}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid rgba(216,180,90,.6);background:transparent;color:var(--cream);cursor:pointer;font-size:15px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl .btn{width:52px;font-size:22px}
.ctrl input{text-align:center;font-size:18px;font-weight:bold}
.note{font-size:12px;color:#e8d6a7;margin-top:8px}
.meta{font-size:11px;color:#b7a77f;margin-top:6px}
.empty{text-align:center;color:#b7a77f;padding:22px 0;font-size:14px}
.footer{font-size:11px;color:#b7a77f;text-align:center;margin-top:20px;line-height:1.7}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000;display:block;padding:0;min-height:0}
  .wrap{display:none!important}
  #printArea{display:block}
  #printArea .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #b8923a;padding-bottom:10px;margin-bottom:12px}
  #printArea img{width:64px;height:64px;border-radius:50%}
  #printArea h2{margin:0;font-size:20px;color:#071a33}
  #printArea .pd{font-size:12px;color:#444;margin-top:4px}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px}
  #printArea th{background:#071a33;color:#fff;padding:7px 6px;border:1px solid #071a33}
  #printArea td{padding:6px;border:1px solid #bbb;text-align:center}
  #printArea td.n{text-align:right}
  #printArea tr{page-break-inside:avoid}
  #printArea tr.low td{background:#fff3da}
  #printArea tr.out td{background:#fde0dd}
  #printArea tfoot td{font-weight:bold;background:#f1e6c6}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <h1>NODO</h1>
  <div class="sub">إدارة المخزون</div>
</header>
<div class="rule"></div>

<div class="stats">
  <div class="stat"><b id="sItems">0</b><span>الأصناف</span></div>
  <div class="stat"><b id="sUnits">0</b><span>إجمالي القطع</span></div>
  <div class="stat"><b id="sLow">0</b><span>قرب يخلص</span></div>
  <div class="stat"><b id="sVal">0</b><span>القيمة (ج.م)</span></div>
</div>

<div class="add">
  <div class="full"><label for="fName">اسم الصنف</label><input id="fName" placeholder="مثال: تيشيرت كشافة" autocomplete="off"></div>
  <div><label for="fSize">المقاس</label><input id="fSize" list="sizes" placeholder="M / L / 42 ..." autocomplete="off"></div>
  <div><label for="fColor">اللون</label><input id="fColor" placeholder="كحلي" autocomplete="off"></div>
  <div><label for="fQty">الكمية</label><input id="fQty" type="number" inputmode="numeric" min="0" value="1"></div>
  <div><label for="fLow">نبّهني لو قلّت عن</label><input id="fLow" type="number" inputmode="numeric" min="0" value="0"></div>
  <div><label for="fPrice">سعر القطعة (ج.م)</label><input id="fPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  <div><label for="fNote">ملاحظات</label><input id="fNote" placeholder="اختياري" autocomplete="off"></div>
  <button class="btn full" id="addBtn" type="button">+ إضافة للمخزون</button>
  <button class="btn ghost full" id="cancelBtn" type="button" hidden>إلغاء التعديل</button>
</div>
<datalist id="sizes"><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option><option>حر</option></datalist>

<input class="search" id="q" type="search" placeholder="ابحث بالاسم أو المقاس أو اللون...">
<div class="tools">
  <button class="btn" id="pdfBtn" type="button">تصدير PDF</button>
  <button class="btn ghost" id="csvBtn" type="button">تصدير Excel</button>
</div>

<div class="list" id="list"></div>

<div class="footer">البيانات محفوظة على جهازك فقط داخل المتصفح.<br>لا تمسح بيانات المتصفح، وصدّر نسخة من وقت لوقت.</div>
</section>
</main>

<div id="printArea"></div>

<script>
(function(){
  var KEY='nodo_inventory_v1', items=[], editId=null;
  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return Number(n).toLocaleString('ar-EG',{maximumFractionDigits:2})};

  function load(){
    try{items=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){items=[]}
    items.forEach(function(i){i.size=i.size||'';i.color=i.color||'';i.note=i.note||'';i.price=+i.price||0;i.low=+i.low||0;i.qty=+i.qty||0});
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('تعذّر الحفظ على هذا المتصفح')}}
  function num(v){v=parseInt(v,10);return isNaN(v)||v<0?0:v}
  function money(v){v=parseFloat(v);return isNaN(v)||v<0?0:v}
  function status(it){return it.qty===0?'out':(it.low>0&&it.qty<=it.low?'low':'')}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function key(i){return [i.name,i.size,i.color].join('|').toLowerCase()}

  function render(){
    var term=$('q').value.trim().toLowerCase(), list=$('list');
    list.innerHTML='';
    var shown=items.filter(function(i){return [i.name,i.size,i.color,i.note].join(' ').toLowerCase().indexOf(term)>-1});
    shown.forEach(function(it){
      var st=status(it), card=el('div','item '+st);
      var top=el('div','top'), left=el('div');
      var nm=el('div');nm.appendChild(el('span','name',it.name));
      if(st==='out')nm.appendChild(el('span','badge out','خلص'));
      else if(st==='low')nm.appendChild(el('span','badge','قرب يخلص'));
      left.appendChild(nm);
      if(it.size||it.color){
        var ch=el('div','chips');
        if(it.size)ch.appendChild(el('span','chip','المقاس: '+it.size));
        if(it.color)ch.appendChild(el('span','chip','اللون: '+it.color));
        left.appendChild(ch);
      }
      var icons=el('div','icons');
      var ed=el('button','icon','✎');ed.type='button';ed.title='تعديل';
      ed.onclick=function(){startEdit(it)};
      var del=el('button','icon','🗑');del.type='button';del.title='حذف';
      del.onclick=function(){if(confirm('حذف "'+it.name+'"؟')){items=items.filter(function(x){return x.id!==it.id});if(editId===it.id)stopEdit();save();render()}};
      icons.appendChild(ed);icons.appendChild(del);
      top.appendChild(left);top.appendChild(icons);

      var ctrl=el('div','ctrl');
      var minus=el('button','btn ghost','−');minus.type='button';
      var plus=el('button','btn','+');plus.type='button';
      var inp=el('input');inp.type='number';inp.inputMode='numeric';inp.min='0';inp.value=it.qty;
      function set(v){it.qty=num(v);it.upd=Date.now();save();render()}
      minus.onclick=function(){set(it.qty-1)};
      plus.onclick=function(){set(it.qty+1)};
      inp.onchange=function(){set(inp.value)};
      ctrl.appendChild(plus);ctrl.appendChild(inp);ctrl.appendChild(minus);

      card.appendChild(top);card.appendChild(ctrl);
      if(it.note)card.appendChild(el('div','note','ملاحظة: '+it.note));
      var meta=[];
      if(it.price>0)meta.push('السعر: '+fmt(it.price)+' ج.م · الإجمالي: '+fmt(it.price*it.qty)+' ج.م');
      if(it.low>0)meta.push('حد التنبيه: '+it.low);
      meta.push('آخر تحديث: '+new Date(it.upd||it.id).toLocaleDateString('ar-EG'));
      card.appendChild(el('div','meta',meta.join(' · ')));
      list.appendChild(card);
    });
    if(!shown.length)list.appendChild(el('div','empty',items.length?'مفيش نتائج للبحث':'لسه مفيش أصناف. ضيف أول صنف من فوق.'));

    $('sItems').textContent=items.length;
    $('sUnits').textContent=fmt(items.reduce(function(a,i){return a+i.qty},0));
    $('sLow').textContent=items.filter(function(i){return status(i)}).length;
    $('sVal').textContent=fmt(items.reduce(function(a,i){return a+i.qty*i.price},0));
  }

  function clearForm(){
    ['fName','fSize','fColor','fNote','fPrice'].forEach(function(id){$(id).value=''});
    $('fQty').value=1;$('fLow').value=0;
  }
  function startEdit(it){
    editId=it.id;
    $('fName').value=it.name;$('fSize').value=it.size;$('fColor').value=it.color;
    $('fQty').value=it.qty;$('fLow').value=it.low;$('fPrice').value=it.price||'';$('fNote').value=it.note;
    $('addBtn').textContent='حفظ التعديل';$('cancelBtn').hidden=false;
    window.scrollTo({top:0,behavior:'smooth'});$('fName').focus();
  }
  function stopEdit(){editId=null;clearForm();$('addBtn').textContent='+ إضافة للمخزون';$('cancelBtn').hidden=true}

  function add(){
    var name=$('fName').value.trim();
    if(!name){$('fName').focus();return}
    var data={name:name,size:$('fSize').value.trim(),color:$('fColor').value.trim(),
      qty:num($('fQty').value),low:num($('fLow').value),price:money($('fPrice').value),note:$('fNote').value.trim(),upd:Date.now()};
    if(editId){
      var it=items.filter(function(x){return x.id===editId})[0];
      if(it)Object.keys(data).forEach(function(k){it[k]=data[k]});
      stopEdit();
    }else{
      var ex=items.filter(function(i){return key(i)===key(data)})[0];
      if(ex){ex.qty+=data.qty;ex.upd=Date.now();if(data.price)ex.price=data.price;if(data.note)ex.note=data.note;if(data.low)ex.low=data.low}
      else{data.id=Date.now();items.unshift(data)}
      clearForm();$('fName').focus();
    }
    save();render();
  }

  function csv(){
    var rows=[['الصنف','المقاس','اللون','الكمية','حد التنبيه','سعر القطعة','الإجمالي','ملاحظات']]
      .concat(items.map(function(i){return [i.name,i.size,i.color,i.qty,i.low,i.price,i.price*i.qty,i.note]}));
    var txt=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
    var blob=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nodo-inventory.csv';
    document.body.appendChild(a);a.click();a.remove();
  }

  function buildPrint(){
    var pa=$('printArea');pa.innerHTML='';
    var ph=el('div','ph'),img=el('img');img.src=$('logoImg').src;
    var tx=el('div');tx.appendChild(el('h2',null,'NODO — تقرير المخزون'));
    tx.appendChild(el('div','pd','التاريخ: '+new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})));
    ph.appendChild(img);ph.appendChild(tx);pa.appendChild(ph);
    var tb=el('table'),th=el('thead'),hr=el('tr');
    ['#','الصنف','المقاس','اللون','الكمية','سعر القطعة','الإجمالي','الحالة','ملاحظات'].forEach(function(h){hr.appendChild(el('th',null,h))});
    th.appendChild(hr);tb.appendChild(th);
    var body=el('tbody'),tq=0,tv=0;
    items.forEach(function(i,n){
      var st=status(i),tr=el('tr',st);
      var tot=i.price*i.qty;tq+=i.qty;tv+=tot;
      [n+1,i.name,i.size||'—',i.color||'—',i.qty,i.price?fmt(i.price):'—',i.price?fmt(tot):'—',
       st==='out'?'خلص':st==='low'?'قرب يخلص':'متوفر',i.note||''].forEach(function(v,c){
        tr.appendChild(el('td',c===1?'n':null,String(v)));
      });
      body.appendChild(tr);
    });
    tb.appendChild(body);
    var tf=el('tfoot'),fr=el('tr'),c1=el('td',null,'الإجمالي');c1.colSpan=4;
    fr.appendChild(c1);fr.appendChild(el('td',null,fmt(tq)));fr.appendChild(el('td',null,''));
    fr.appendChild(el('td',null,fmt(tv)+' ج.م'));var c2=el('td',null,'');c2.colSpan=2;fr.appendChild(c2);
    tf.appendChild(fr);tb.appendChild(tf);pa.appendChild(tb);
  }
  function pdf(){
    if(!items.length){alert('مفيش أصناف للتصدير');return}
    buildPrint();
    alert('في نافذة الطباعة اختار "Save as PDF" (حفظ كـ PDF) كوجهة للطباعة.');
    window.print();
  }

  $('addBtn').onclick=add;
  $('cancelBtn').onclick=stopEdit;
  ['fName','fSize','fColor','fQty','fLow','fPrice','fNote'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  });
  $('q').addEventListener('input',render);
  $('csvBtn').onclick=csv;
  $('pdfBtn').onclick=pdf;
  load();render();
})();
</script>
<script>
(function () {
  var frame = document.querySelector('.frame');
  var svg = frame.querySelector('.rope');
  var NS = 'http://www.w3.org/2000/svg';

  function build() {
    var W = frame.clientWidth, H = frame.clientHeight;
    var rw = 7;                // rope thickness
    var i = rw / 2 + 1;        // inset so the rope stays inside the frame
    var r = 26 - i;            // corner radius of the rope centre line
    var x0 = i, y0 = i, w = W - 2 * i, h = H - 2 * i;
    var PI = Math.PI, arcLen = PI * r / 2;

    var segs = [
      { t: 's', x: x0 + r,     y: y0,         dx: 1,  dy: 0,  len: w - 2 * r },
      { t: 'a', cx: x0 + w - r, cy: y0 + r,     a0: -PI / 2 },
      { t: 's', x: x0 + w,     y: y0 + r,     dx: 0,  dy: 1,  len: h - 2 * r },
      { t: 'a', cx: x0 + w - r, cy: y0 + h - r, a0: 0 },
      { t: 's', x: x0 + w - r, y: y0 + h,     dx: -1, dy: 0,  len: w - 2 * r },
      { t: 'a', cx: x0 + r,     cy: y0 + h - r, a0: PI / 2 },
      { t: 's', x: x0,         y: y0 + h - r, dx: 0,  dy: -1, len: h - 2 * r },
      { t: 'a', cx: x0 + r,     cy: y0 + r,     a0: PI }
    ];
    segs.forEach(function (g) { if (g.t === 'a') g.len = arcLen; });
    var P = segs.reduce(function (a, g) { return a + g.len; }, 0);

    function at(s) {
      for (var k = 0; k < segs.length; k++) {
        var g = segs[k];
        if (s <= g.len || k === segs.length - 1) {
          if (g.t === 's') return { x: g.x + g.dx * s, y: g.y + g.dy * s, tx: g.dx, ty: g.dy };
          var th = g.a0 + s / r;
          return { x: g.cx + r * Math.cos(th), y: g.cy + r * Math.sin(th), tx: -Math.sin(th), ty: Math.cos(th) };
        }
        s -= g.len;
      }
    }

    var n = Math.round(P / 2.9), step = P / n;
    var dark = '', light = '';
    for (var j = 0; j < n; j++) {
      var q = at(j * step), hw = rw / 2, k2 = 1.5;
      var nx = -q.ty, ny = q.tx;
      function line(off) {
        var cx = q.x + q.tx * off, cy = q.y + q.ty * off;
        return 'M' + (cx + nx * hw - q.tx * k2).toFixed(2) + ' ' + (cy + ny * hw - q.ty * k2).toFixed(2) +
               'L' + (cx - nx * hw + q.tx * k2).toFixed(2) + ' ' + (cy - ny * hw + q.ty * k2).toFixed(2);
      }
      dark += line(0);
      light += line(1);
    }

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var rect = 'x="' + x0 + '" y="' + y0 + '" width="' + w + '" height="' + h + '" rx="' + r + '" fill="none"';
    svg.innerHTML =
      '<rect ' + rect + ' stroke="#7a5a14" stroke-width="' + (rw + 1) + '"/>' +
      '<rect ' + rect + ' stroke="#e6b94c" stroke-width="' + (rw - .8) + '"/>' +
      '<path d="' + light + '" stroke="#fff0b8" stroke-opacity=".75" stroke-width=".8" fill="none"/>' +
      '<path d="' + dark + '" stroke="#8a6414" stroke-opacity=".85" stroke-width="1" fill="none"/>';
  }

  build();
  if (window.ResizeObserver) new ResizeObserver(build).observe(frame);
  else window.addEventListener('resize', build);
})();
</script>
